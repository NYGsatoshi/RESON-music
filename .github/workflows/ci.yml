name: CI

on:
  pull_request:
  push:
    branches:
      - claude/new-session-b6um0m
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Build static locale preview
        run: ./scripts/build-static-preview.sh

      - name: Verify static locale output
        shell: bash
        run: |
          test -f out/index.html
          test -f out/en/index.html
          test ! -d out/ja
