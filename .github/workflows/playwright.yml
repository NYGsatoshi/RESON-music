name: Playwright E2E

on:
  pull_request:
  push:
    branches:
      - claude/new-session-b6um0m
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test dependency
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers and system dependencies
        working-directory: e2e
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase environment
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "ENABLE_DEV_SEED_ACCOUNT=true"
            echo "CRON_SECRET=e2e-local-cron-secret"
            echo "E2E_CRON_SECRET=e2e-local-cron-secret"
          } >> "$GITHUB_ENV"

      - name: Run Playwright tests
        working-directory: e2e
        env:
          E2E_CROSS_BROWSER: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: npm test

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload visual smoke snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-snapshots-${{ github.run_attempt }}
          path: e2e/visual-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      # One-time bootstrap for PR #15. This is removed after the generated
      # baselines are committed and the pixel-diff gate is enabled.
      - name: Stage visual regression baselines
        if: github.event_name == 'pull_request' && github.head_ref == 'test/visual-regression-gate'
        shell: bash
        run: |
          rm -rf /tmp/reson-visual-baselines
          mkdir -p /tmp/reson-visual-baselines
          cp e2e/visual-artifacts/*-mobile.png /tmp/reson-visual-baselines/

      - name: Checkout visual regression branch for baseline commit
        if: github.event_name == 'pull_request' && github.head_ref == 'test/visual-regression-gate'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Commit visual regression baselines once
        if: github.event_name == 'pull_request' && github.head_ref == 'test/visual-regression-gate'
        shell: bash
        run: |
          if [ -f e2e/visual-baselines/home-mobile.png ]; then
            echo "Visual baselines already exist; skipping bootstrap commit."
            exit 0
          fi
          mkdir -p e2e/visual-baselines
          cp /tmp/reson-visual-baselines/*-mobile.png e2e/visual-baselines/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual-baselines
          git commit -m "test(e2e): add visual regression baselines"
          git push origin HEAD:${{ github.head_ref }}
