name: Playwright E2E

on:
  pull_request:
  push:
    branches:
      - claude/new-session-b6um0m
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test dependency
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Chromium and system dependencies
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase environment
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "ENABLE_DEV_SEED_ACCOUNT=true"
            echo "CRON_SECRET=e2e-local-cron-secret"
            echo "E2E_CRON_SECRET=e2e-local-cron-secret"
          } >> "$GITHUB_ENV"

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
