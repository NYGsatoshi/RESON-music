name: Bootstrap visual baselines

on:
  push:
    branches:
      - test/visual-regression-gate

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout baseline branch
        uses: actions/checkout@v4
        with:
          ref: test/visual-regression-gate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test dependency
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase environment
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "ENABLE_DEV_SEED_ACCOUNT=true"
            echo "CRON_SECRET=visual-baseline-local-cron-secret"
            echo "E2E_CRON_SECRET=visual-baseline-local-cron-secret"
          } >> "$GITHUB_ENV"

      - name: Generate visual baselines
        working-directory: e2e
        run: npx playwright test --project=visual-mobile-chromium

      - name: Commit generated baseline PNGs
        shell: bash
        run: |
          mkdir -p e2e/tests/visual-baselines
          cp e2e/visual-artifacts/*-mobile.png e2e/tests/visual-baselines/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/tests/visual-baselines/
          if git diff --cached --quiet; then
            echo "Visual baselines already match."
            exit 0
          fi
          git commit -m "test(e2e): record visual regression baselines"
          git push origin HEAD:test/visual-regression-gate

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
